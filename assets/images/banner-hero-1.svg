<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFF0F3"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B69"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="igGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="110" fill="#FFDCE3" opacity="0.6"/>

  <!-- Main Smartphone Mockup -->
  <g filter="url(#softShadow)" transform="translate(130, 35)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="150" height="230" rx="28" fill="url(#phoneGrad)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Speaker & Camera notch -->
    <rect x="52" y="10" width="46" height="5" rx="2.5" fill="#CBD5E1"/>
    <circle cx="106" cy="12.5" r="2.5" fill="#94A3B8"/>
    
    <!-- Screen Content -->
    <g transform="translate(14, 28)">
      <!-- Profile Header -->
      <circle cx="16" cy="16" r="14" fill="#FFE2E8"/>
      <circle cx="16" cy="13" r="6" fill="#F43F5E"/>
      <path d="M7 25 C7 20, 25 20, 25 25" fill="#F43F5E"/>
      <rect x="36" y="8" width="56" height="6" rx="3" fill="#334155"/>
      <rect x="36" y="18" width="40" height="5" rx="2.5" fill="#94A3B8"/>

      <!-- Analytics Graph Box -->
      <rect x="0" y="38" width="122" height="70" rx="12" fill="#FFFFFF" stroke="#FCE4E8" stroke-width="1.5"/>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#64748B">GROWTH STATS</text>
      <text x="10" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#E11D48">+485%</text>
      <!-- Mini Line Graph -->
      <path d="M 12 96 Q 35 90, 50 82 T 85 70 T 112 56" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="112" cy="56" r="3" fill="#E11D48"/>

      <!-- Engagement Mini Cards -->
      <rect x="0" y="116" width="58" height="34" rx="8" fill="#FFF0F3"/>
      <text x="8" y="128" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#F43F5E">Followers</text>
      <text x="8" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#1E293B">128.4K</text>

      <rect x="64" y="116" width="58" height="34" rx="8" fill="#FFF0F3"/>
      <text x="72" y="128" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#F43F5E">Likes</text>
      <text x="72" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#1E293B">520.1K</text>
    </g>

    <!-- Bottom Home Indicator -->
    <rect x="50" y="218" width="50" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Floating Social Badge 1: Instagram (Top Left) -->
  <g filter="url(#badgeShadow)" transform="translate(60, 45)">
    <rect width="44" height="44" rx="14" fill="url(#igGrad)"/>
    <rect x="11" y="11" width="22" height="22" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="22" cy="22" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="27.5" cy="16.5" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Badge 2: YouTube (Right) -->
  <g filter="url(#badgeShadow)" transform="translate(305, 55)">
    <rect width="42" height="42" rx="14" fill="#DC2626"/>
    <polygon points="17,14 29,21 17,28" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Badge 3: TikTok / Music (Bottom Left) -->
  <g filter="url(#badgeShadow)" transform="translate(70, 175)">
    <rect width="42" height="42" rx="14" fill="#0F172A"/>
    <path d="M25 13 C26 15 28 17 30 17 L30 20 C28 20 26 19 25 18 L25 24 C25 27 22.5 29 19.5 29 C16.5 29 14 26.5 14 23.5 C14 20.5 16.5 18 19.5 18 C20 18 20.5 18.1 21 18.3 L21 21.5 C20.6 21.2 20 21 19.5 21 C18.1 21 17 22.1 17 23.5 C17 24.9 18.1 26 19.5 26 C20.9 26 22 24.9 22 23.5 L22 13 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Badge 4: Telegram (Bottom Right) -->
  <g filter="url(#badgeShadow)" transform="translate(300, 180)">
    <rect width="42" height="42" rx="14" fill="url(#blueGrad)"/>
    <path d="M12 21 L28 14 L24 27 L20 23 L18 25 L18 22 Z" fill="#FFFFFF"/>
    <path d="M20 23 L25 17" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Floating Rose Pill Badge: +10.5K Engagement -->
  <g filter="url(#badgeShadow)" transform="translate(195, 20)">
    <rect width="96" height="32" rx="16" fill="url(#roseGrad)"/>
    <!-- Heart Icon -->
    <path d="M20 17.5 C20 15 17 13 14.5 15.5 C12 13 9 15 9 17.5 C9 21.5 14.5 24 14.5 24 C14.5 24 20 21.5 20 17.5 Z" fill="#FFFFFF"/>
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">+10.5K</text>
  </g>
</svg>
