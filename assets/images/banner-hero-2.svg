<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rocketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <linearGradient id="roseGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B69"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="210" cy="150" r="110" fill="#FFDCE3" opacity="0.6"/>

  <!-- Speed Trails / Background Rays -->
  <path d="M 90 220 L 150 170" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 120 250 L 180 200" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M 270 90 L 330 40" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.4"/>

  <!-- Rocket Ship Illustration -->
  <g filter="url(#softShadow2)" transform="translate(140, 45) rotate(45 90 90)">
    <!-- Rocket Flame -->
    <path d="M 30 110 Q 40 160, 40 170 Q 40 160, 50 110 Z" fill="url(#flameGrad)" opacity="0.9"/>
    <path d="M 34 110 Q 40 145, 40 150 Q 40 145, 46 110 Z" fill="#FEF08A"/>

    <!-- Left Fin -->
    <path d="M 20 85 L 8 115 L 28 108 Z" fill="#E11D48"/>
    <!-- Right Fin -->
    <path d="M 60 85 L 72 115 L 52 108 Z" fill="#E11D48"/>

    <!-- Rocket Body -->
    <path d="M 40 10 Q 65 35, 65 95 L 15 95 Q 15 35, 40 10 Z" fill="url(#rocketGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Nosecone -->
    <path d="M 40 10 Q 55 25, 58 40 L 22 40 Q 25 25, 40 10 Z" fill="url(#roseGrad2)"/>

    <!-- Porthole Window -->
    <circle cx="40" cy="62" r="14" fill="#FFE2E8" stroke="#E11D48" stroke-width="2.5"/>
    <circle cx="40" cy="62" r="10" fill="#0284C7"/>
    <!-- Reflection -->
    <ellipse cx="37" cy="59" rx="4" ry="2" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 37 59)"/>
  </g>

  <!-- Metric Card: 99.9% High Retention (Top Right) -->
  <g filter="url(#badgeShadow2)" transform="translate(260, 40)">
    <rect width="115" height="54" rx="14" fill="#FFFFFF" stroke="#FCE4E8" stroke-width="1.5"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#64748B">SUCCESS RATE</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#10B981">99.9%</text>
    <circle cx="95" cy="27" r="10" fill="#D1FAE5"/>
    <path d="M91 27 L94 30 L99 24" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Badge: Instant Start (Bottom Left) -->
  <g filter="url(#badgeShadow2)" transform="translate(45, 175)">
    <rect width="125" height="42" rx="14" fill="url(#roseGrad2)"/>
    <!-- Lightning Icon -->
    <polygon points="18,22 24,13 24,20 29,20 22,31 22,23" fill="#FDE047"/>
    <text x="34" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFE4E8">SPEED</text>
    <text x="34" y="33" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">0-5m Delivery</text>
  </g>

  <!-- Floating Badge: 24/7 Live Automation (Bottom Right) -->
  <g filter="url(#badgeShadow2)" transform="translate(255, 175)">
    <rect width="118" height="42" rx="14" fill="#0F172A"/>
    <!-- Clock / Pulse Icon -->
    <circle cx="20" cy="21" r="9" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <polyline points="20,16 20,21 24,23" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">AUTOMATION</text>
    <text x="36" y="33" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#38BDF8">24/7 Active</text>
  </g>

  <!-- Floating Star Badge (Top Left) -->
  <g filter="url(#badgeShadow2)" transform="translate(65, 55)">
    <rect width="40" height="40" rx="12" fill="url(#amberGrad)"/>
    <polygon points="20,9 23,16 30,17 25,22 26,29 20,25 14,29 15,22 10,17 17,16" fill="#FFFFFF"/>
  </g>
</svg>
